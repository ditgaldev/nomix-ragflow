name: Verify deployed Business Gateway

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-gateway-production-gate
  cancel-in-progress: false

jobs:
  production-gate:
    runs-on: ubuntu-latest
    environment: business-gateway-production
    timeout-minutes: 20
    env:
      NOMIX_BG_TEST_BASE_URL: ${{ vars.NOMIX_BG_TEST_BASE_URL }}
      NOMIX_BG_TEST_ACCESS_TOKEN: ${{ secrets.NOMIX_BG_TEST_ACCESS_TOKEN_A }}
      NOMIX_BG_TEST_ACCESS_TOKEN_A: ${{ secrets.NOMIX_BG_TEST_ACCESS_TOKEN_A }}
      NOMIX_BG_TEST_ACCESS_TOKEN_B: ${{ secrets.NOMIX_BG_TEST_ACCESS_TOKEN_B }}
      NOMIX_BG_LIVE_ALLOW_WRITES: ${{ vars.NOMIX_BG_LIVE_ALLOW_WRITES }}
      NOMIX_BG_TEST_PARSE_TIMEOUT_SECONDS: ${{ vars.NOMIX_BG_TEST_PARSE_TIMEOUT_SECONDS }}
      NOMIX_BG_TEST_POLL_INTERVAL_SECONDS: ${{ vars.NOMIX_BG_TEST_POLL_INTERVAL_SECONDS }}
      NOMIX_BG_TEST_REQUEST_TIMEOUT_SECONDS: ${{ vars.NOMIX_BG_TEST_REQUEST_TIMEOUT_SECONDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Configure the runner-local redacted report path
        run: echo "NOMIX_BG_TEST_REPORT_FILE=$RUNNER_TEMP/business-gateway-live-data-plane.json" >> "$GITHUB_ENV"
      - name: Require environment-scoped target, identities, and explicit write authorization
        run: |
          test -n "$NOMIX_BG_TEST_BASE_URL"
          test -n "$NOMIX_BG_TEST_ACCESS_TOKEN_A"
          test -n "$NOMIX_BG_TEST_ACCESS_TOKEN_B"
          test "$NOMIX_BG_TEST_ACCESS_TOKEN_A" != "$NOMIX_BG_TEST_ACCESS_TOKEN_B"
          test "$NOMIX_BG_LIVE_ALLOW_WRITES" = "true"
      - name: Run the passive HTTPS and network-isolation gate
        run: python scripts/verify-business-gateway-deployment.py
      - name: Run the self-cleaning two-workspace live data-plane gate
        run: python -m scripts.business_gateway_live_data_plane
      - name: Upload redacted live-gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-gateway-live-data-plane-${{ github.run_id }}
          path: ${{ runner.temp }}/business-gateway-live-data-plane.json
          if-no-files-found: warn
          retention-days: 30
