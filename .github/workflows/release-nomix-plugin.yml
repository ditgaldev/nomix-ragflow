name: Release Nomix RAGFlow plugin

on:
  push:
    branches:
      - npm-nomix-ragflow
    tags:
      - 'nomix-v*'
  pull_request:

permissions:
  contents: read

jobs:
  gateway-contract:
    name: Verify Business Gateway retrieval contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.0.2 pytest-asyncio==1.3.0
      - name: Verify the current RAGFlow retrieval adapter contract
        run: python -m pytest --confcutdir=test/unit_test/api/apps/business_gateway -q test/unit_test/api/apps/business_gateway/test_retrieval_port.py

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    defaults:
      run:
        working-directory: integrations/nomix-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify published Harness baseline
        shell: bash
        run: |
          package=@nomix-ai/nomix-harness
          expected="$(node -p "require('./package.json').devDependencies['$package']")"
          actual="$(npm view "$package@$expected" version)"
          test "$actual" = "$expected" || { echo "$package: expected $expected, registry returned $actual"; exit 1; }
      - run: npm install
      - run: npm run harness:link
      - run: npm run contracts:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install pnpm for Harness profile verification
        run: npm install --global pnpm@10.16.1
      - name: Pack and audit
        shell: bash
        run: |
          tarball="$(npm pack --ignore-scripts --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)[0].filename))")"
          node scripts/audit-tarball.mjs "$tarball"
          node scripts/verify-consumer.mjs "$tarball"
          node scripts/verify-profile.mjs "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
        id: pack
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/npm-nomix-ragflow' && matrix.os == 'ubuntu-latest'
        with:
          name: nomix-ragflow-${{ github.sha }}
          path: integrations/nomix-harness/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  publish:
    needs:
      - gateway-contract
      - verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/npm-nomix-ragflow'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/nomix-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: nomix-ragflow-${{ github.sha }}
          path: integrations/nomix-harness
      - name: Refuse an existing version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          error_file="$(mktemp)"
          if npm view "@nomix-ai/nomix-ragflow@$version" version >/dev/null 2>"$error_file"; then
            echo "@nomix-ai/nomix-ragflow@$version already exists"
            exit 1
          fi
          grep -qE 'E404|404 Not Found' "$error_file" || { cat "$error_file"; echo 'registry preflight failed'; exit 1; }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish exact artifact
        shell: bash
        run: |
          tarball="$(find . -maxdepth 1 -name 'nomix-ai-nomix-ragflow-*.tgz' -print -quit)"
          test -n "$tarball"
          npm publish "$tarball" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify registry metadata and provenance
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tarball="$(find . -maxdepth 1 -name 'nomix-ai-nomix-ragflow-*.tgz' -print -quit)"
          expected_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          for attempt in {1..20}; do
            published="$(npm view "@nomix-ai/nomix-ragflow@$version" --json 2>/dev/null || true)"
            latest="$(npm view @nomix-ai/nomix-ragflow dist-tags.latest 2>/dev/null || true)"
            integrity="$(npm view "@nomix-ai/nomix-ragflow@$version" dist.integrity 2>/dev/null || true)"
            attestations="$(npm view "@nomix-ai/nomix-ragflow@$version" dist.attestations.url 2>/dev/null || true)"
            if test -n "$published" && test "$latest" = "$version" && test "$integrity" = "$expected_integrity" && test -n "$attestations"; then exit 0; fi
            sleep 15
          done
          echo "registry verification timed out"; exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
