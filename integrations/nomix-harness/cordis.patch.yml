# The provider-neutral Service Definition is inert and always safe to mount.
# The disabled composition row binds a deployment Gateway Provider and installs
# the Consumer only on explicitly selected Agents.
- insert:
    - id: ragflow-service
      name: '@nomix-ai/nomix-ragflow/service'

    - id: ragflow
      name: '@nomix-ai/nomix-ragflow/plugin'
      disabled: true
