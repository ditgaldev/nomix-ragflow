services:
  ragflow-cpu:
    ports: !override
      - ${RAGFLOW_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${SVR_WEB_HTTP_PORT}:80
      - ${RAGFLOW_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${SVR_WEB_HTTPS_PORT}:443
      - ${RAGFLOW_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${SVR_HTTP_PORT}:9380
      - ${RAGFLOW_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${ADMIN_SVR_HTTP_PORT}:9381
      - ${RAGFLOW_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${SVR_MCP_PORT}:9382
      - ${RAGFLOW_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${GO_HTTP_PORT}:9384
      - ${RAGFLOW_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${GO_ADMIN_PORT}:9383
    environment: &business-gateway-introspection
      NOMIX_BG_ENABLED: "true"
      NOMIX_BG_INTROSPECTION_URL: ${NOMIX_BG_INTROSPECTION_URL:?set NOMIX_BG_INTROSPECTION_URL}
      NOMIX_BG_AUTHORITY: ${NOMIX_BG_AUTHORITY:?set NOMIX_BG_AUTHORITY}
      NOMIX_BG_AUDIENCE: ${NOMIX_BG_AUDIENCE:-nomix-ragflow-data}
      NOMIX_BG_CURSOR_SECRET: ${NOMIX_BG_CURSOR_SECRET:?set a random NOMIX_BG_CURSOR_SECRET of at least 32 bytes}
      NOMIX_BG_INTROSPECTION_AUTH_MODE: ${NOMIX_BG_INTROSPECTION_AUTH_MODE:-basic}
      NOMIX_BG_INTROSPECTION_CLIENT_ID: ${NOMIX_BG_INTROSPECTION_CLIENT_ID:-}
      NOMIX_BG_INTROSPECTION_CLIENT_SECRET: ${NOMIX_BG_INTROSPECTION_CLIENT_SECRET:-}
      NOMIX_BG_INTROSPECTION_CA_FILE: ${NOMIX_BG_INTROSPECTION_CA_FILE:-}
      NOMIX_BG_INTROSPECTION_CERT_FILE: ${NOMIX_BG_INTROSPECTION_CERT_FILE:-}
      NOMIX_BG_INTROSPECTION_KEY_FILE: ${NOMIX_BG_INTROSPECTION_KEY_FILE:-}
      NOMIX_BG_INTROSPECTION_TIMEOUT_SECONDS: ${NOMIX_BG_INTROSPECTION_TIMEOUT_SECONDS:-3}
      NOMIX_BG_INTROSPECTION_RETRIES: ${NOMIX_BG_INTROSPECTION_RETRIES:-1}
      NOMIX_BG_INTROSPECTION_CACHE_SECONDS: ${NOMIX_BG_INTROSPECTION_CACHE_SECONDS:-5}
      NOMIX_BG_INTROSPECTION_MAX_CONNECTIONS: ${NOMIX_BG_INTROSPECTION_MAX_CONNECTIONS:-100}
      NOMIX_BG_MAX_FILE_BYTES: ${NOMIX_BG_MAX_FILE_BYTES:-67108864}
      NOMIX_BG_MAX_REQUEST_BYTES: ${NOMIX_BG_MAX_REQUEST_BYTES:-75497472}
      NOMIX_BG_READINESS_TIMEOUT_SECONDS: ${NOMIX_BG_READINESS_TIMEOUT_SECONDS:-5}
      NOMIX_BG_CONCURRENCY_LOCK_SECONDS: ${NOMIX_BG_CONCURRENCY_LOCK_SECONDS:-900}
      NOMIX_BG_CONCURRENCY_WAIT_SECONDS: ${NOMIX_BG_CONCURRENCY_WAIT_SECONDS:-2}
    networks:
      ragflow:
        aliases:
          - ragflow-business-upstream

  ragflow-gpu:
    ports: !override
      - ${RAGFLOW_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${SVR_WEB_HTTP_PORT}:80
      - ${RAGFLOW_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${SVR_WEB_HTTPS_PORT}:443
      - ${RAGFLOW_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${SVR_HTTP_PORT}:9380
      - ${RAGFLOW_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${ADMIN_SVR_HTTP_PORT}:9381
      - ${RAGFLOW_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${SVR_MCP_PORT}:9382
    environment: *business-gateway-introspection
    networks:
      ragflow:
        aliases:
          - ragflow-business-upstream

  business-gateway:
    image: nginx:1.29-alpine
    environment:
      RAGFLOW_BUSINESS_UPSTREAM: ${RAGFLOW_BUSINESS_UPSTREAM:-ragflow-business-upstream:9380}
      BUSINESS_GATEWAY_REQUEST_BODY_SIZE: ${NOMIX_BG_MAX_REQUEST_BYTES:-75497472}
      BUSINESS_GATEWAY_MAX_BODY_SIZE: ${NOMIX_BG_PROXY_MAX_REQUEST_BYTES:-83886080}
    command:
      - /bin/sh
      - -eu
      - -c
      - test "$$BUSINESS_GATEWAY_MAX_BODY_SIZE" -gt "$$BUSINESS_GATEWAY_REQUEST_BODY_SIZE" || { echo 'NOMIX_BG_PROXY_MAX_REQUEST_BYTES must exceed NOMIX_BG_MAX_REQUEST_BYTES' >&2; exit 1; }; envsubst '$$RAGFLOW_BUSINESS_UPSTREAM $$BUSINESS_GATEWAY_MAX_BODY_SIZE' < /etc/nginx/templates/business-gateway.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    volumes:
      - ./nginx/business-gateway.conf.template:/etc/nginx/templates/business-gateway.conf.template:ro
      - ${BUSINESS_GATEWAY_TLS_CERT_FILE:?set BUSINESS_GATEWAY_TLS_CERT_FILE}:/run/secrets/business-gateway-tls.crt:ro
      - ${BUSINESS_GATEWAY_TLS_KEY_FILE:?set BUSINESS_GATEWAY_TLS_KEY_FILE}:/run/secrets/business-gateway-tls.key:ro
    ports:
      - ${BUSINESS_GATEWAY_PORT:-9480}:8443
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "https://127.0.0.1:8443/api/v1/ready"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 30s
    networks:
      - ragflow
    restart: unless-stopped

networks:
  ragflow:
    external: false
